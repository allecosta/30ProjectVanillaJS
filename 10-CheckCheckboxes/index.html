<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check Multiple Checkboxes</title>
  <link rel="icon" href="https://fav.farm/✅" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="inbox">
    <div class="item">
      <input type="checkbox">
      <p>Este é um layout de caixa de entrada</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Marque um item</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Mantenha a tecla Shift pressionada</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Marque um item inferior</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Tudo entre eles também deve ser marcado</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Tente fazer isso sem nenhuma biblioteca</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Apenas com JavaScript</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Boa sorte!</p>
    </div>
  </div>
<script src="assets/js/script.js"></script>
</body>
</html>
