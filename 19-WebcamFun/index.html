<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Get User Media Code Along!</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <div class="photobooth">
    <div class="controls">
      <button onClick="takePhoto()">Take Photo</button>
      <div class="rgb">
        <label>Red Min:<input type="range" min=0 max=255></label>
        <label>Red Max:<input type="range" min=0 max=255></label>
        
        <br>
        
        <label>Green Min:<input type="range" min=0 max=255></label>
        <label>Green Max:<input type="range" min=0 max=255></label>
        
        <br>
        
        <label>Blue Min:<input type="range" min=0 max=255></label>
        <label>Blue Max:<input type="range" min=0 max=255></label>
      </div>
    </div>
    <canvas class="photo"></canvas>
    <video class="player"></video>
    <div class="strip"></div>
  </div>
  <audio class="snap" src="assets/media/snap.mp3" hidden></audio>
  <script src="assets/js/scripts.js"></script>
</body>
</html>
