<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="https://fav.farm/✅" />
</head>
<body>
    <div class="voiceinator">
        <h1>The Voiceinator</h1>

        <select name="voice" id="voices"><option value="">Select A Voice</option></select>

        <label>Rate:<input type="range" min="0" max="3" value="1" step="0.1"></label>
        <label>Pitch:<input type="range" min="0" max="2" step="0.1"></label>

        <textarea name="text">Hello friend! I love JavaScript </textarea>
        
        <button id="stop">Stop</button>
        <button id="speak">Speak</button>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
