<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scoped CSS Variables and JS</title>
  <link rel="icon" href="https://fav.farm/✅" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <h2>Update CSS Variables with <span class='hl'>JS</span></h2>

  <div class="controls">
    <label>
        Spacing: <input type="range" name="spacing" min="10" max="200" value="10" data-sizing="px">
    </label>
    <label>
        Blur: <input type="range" name="blur" min="0" max="25" value="10" data-sizing="px">
    </label>
    <label>
       Base Color: <input type="color" name="base" value="#ffc600">
    </label>   
  </div>

  <img src="https://source.unsplash.com/7bwQXzbF6KE/800x500">


  <script src="assets/js/script.js"></script>

</body>
</html>
